:root{
 color-scheme:dark;
 --bg:#1a1410;--wood:#3a2b1f;--wood2:#4a3727;--wood3:#2a1f16;--ink:#140e0a;
 --line:#5c4733;--text:#f3e6c8;--muted:#c4ae88;--dim:#97845f;
 --gold:#e9c25a;--gold2:#c08a24;--leaf:#8fa04a;
 --dawn:#4579d6;--dawn-l:#9cc0ff;--dusk:#cf4a3b;--dusk-l:#ff9f8e;
 --parch:#f2e4c2;--parch2:#e6d3a8;
 --move:#bdf3ff;--attack:#ff7a62;--cast:#b993ff;--aoe:#ffd24a;
 --radius:16px;--shadow:0 5px 0 var(--ink);
 --f-display:"Grenze Gotisch",Georgia,"Times New Roman",serif;
 --f-ui:Nunito,ui-rounded,"Segoe UI",system-ui,-apple-system,sans-serif;
 font-family:var(--f-ui);
}
/* Reading surfaces swap the palette to dark ink on parchment. */
.parchment,.modal,.hero-card{
 --text:#2b1d16;--muted:#6b5638;--dim:#8a7350;--line:#c8b088;--gold:#9a640e;
 --dawn-l:#2f5fb8;--dusk-l:#b23a2c;
}

body{margin:0;min-height:100vh;font-size:14px;line-height:1.5;color:var(--text);
 background:radial-gradient(70% 45% at 50% 0,#3b2f22 0,transparent 70%),radial-gradient(120% 80% at 50% 120%,#0d0907 0,transparent 60%),var(--bg)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance}
h1{font-size:clamp(34px,4.6vw,52px);line-height:1}
h2{font-size:26px;line-height:1.05}
h3{font-size:19px}
small,.small{font-size:12px}
.muted{color:var(--muted)}
a{color:var(--gold)}
svg{width:22px;height:22px;display:block}
body>svg{position:absolute!important;width:0!important;height:0!important;overflow:hidden}
.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:10px;font-weight:900;color:var(--gold)}

/* ---------- Buttons ---------- */
button,select{font:inherit}
button{cursor:pointer;color:#f3e6c8;min-height:44px;padding:10px 15px;border-radius:12px;border:2px solid var(--ink);
 background:linear-gradient(180deg,var(--wood2),var(--wood));font-weight:800;
 box-shadow:inset 0 2px 0 #ffffff1c,inset 0 -3px 0 #00000040,0 3px 0 var(--ink);
 touch-action:manipulation;transition:transform .08s,box-shadow .08s,filter .15s}
button:hover:not(:disabled){filter:brightness(1.12)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 2px 0 #ffffff1c,inset 0 -2px 0 #00000040,0 1px 0 var(--ink)}
button:disabled{cursor:not-allowed;opacity:.45;filter:grayscale(.4)}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.primary{color:#2b1d16;background:linear-gradient(180deg,#ffd978,#e6a83a);box-shadow:inset 0 2px 0 #fff6,inset 0 -4px 0 #b47a1a,0 3px 0 var(--ink)}
.quiet{background:transparent;border-color:var(--line);box-shadow:none;color:var(--muted)}
.quiet:active:not(:disabled){box-shadow:none}
.danger{color:var(--dusk-l)}
select{background:#fff8e6;border:2px solid var(--ink);color:#2b1d16;border-radius:10px;padding:8px;min-height:44px;max-width:100%;font-weight:700}

/* ---------- Shell ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.brandmark{width:42px;height:46px;display:grid;place-items:center;color:#2b1d16;
 background:radial-gradient(circle at 40% 30%,#ffe9a0,var(--gold) 55%,var(--gold2));border:3px solid var(--ink);
 border-radius:12px 12px 50% 50%/12px 12px 40% 40%;box-shadow:var(--shadow)}
.brandmark svg{width:24px;height:24px;stroke-width:2.2}
.wordmark{font-family:var(--f-display);font-size:34px;line-height:.9;letter-spacing:.06em;
 background:linear-gradient(90deg,#ffd978,#e6853a 60%,#cf4a3b);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 2px 0 var(--ink))}
.subbrand{font-size:9px;color:var(--dim);letter-spacing:.24em;margin-top:4px;font-weight:900}
.nav{display:flex;gap:4px;background:var(--wood3);border:2px solid var(--ink);border-radius:14px;padding:4px}
.nav button{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted);padding:8px 14px;min-height:40px}
.nav button.active{background:linear-gradient(180deg,var(--wood2),var(--wood));border-color:var(--ink);color:var(--text);box-shadow:0 2px 0 var(--ink)}
/* ---------- Sprites ---------- */
.sprite{width:100%;height:100%;overflow:visible;pointer-events:none}
.bh .sc{fill:var(--sc)}.bh .scD{fill:var(--scD)}
.sprite .dawn{--sc:#33609e;--scD:#1f3d6a}
.sprite .dusk{--sc:#a8402a;--scD:#6e2418}
/* Round portrait frame used on cards, bench, slots and dossiers. */
.hero-icon{flex-shrink:0;display:block;width:48px;height:48px;border-radius:50%;overflow:hidden;border:3px solid var(--ink);
 background:radial-gradient(circle at 50% 35%,#cfe07e,#7f9434 75%);box-shadow:0 0 0 2px var(--dawn) inset}
.hero-icon.dusk{box-shadow:0 0 0 2px var(--dusk) inset}
.sprite.face{overflow:hidden}

/* ---------- Shared bits ---------- */
.ic{width:20px;height:20px;flex-shrink:0}
.icon-btn{min-height:40px;min-width:40px;padding:0;display:grid;place-items:center;border-radius:12px}
.t0{--team:var(--dawn);--team-l:var(--dawn-l)}.t1{--team:var(--dusk);--team-l:var(--dusk-l)}
strong.t0{color:var(--dawn-l)}strong.t1{color:var(--dusk-l)}
.face{display:block;flex-shrink:0;width:40px;height:40px;border-radius:50%;overflow:hidden;border:2.5px solid var(--ink);
 background:radial-gradient(circle at 50% 35%,#cfe07e,#7f9434 75%);box-shadow:0 0 0 2px var(--team,var(--dawn)) inset}
.face.dawn{--team:var(--dawn)}.face.dusk{--team:var(--dusk)}
.face .sprite{width:100%;height:100%}
.face.gone{filter:grayscale(1) brightness(.6)}
.cls-tag{max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;
 padding:1px 6px 1px 4px;border-radius:99px;border:1.5px solid var(--ink);color:#2b1d16;background:#e6d3a8;line-height:1.5;white-space:nowrap}
.cls-tag .ic{width:11px;height:11px;stroke-width:2.4}
.cls-tag.tank{background:#9cbfee}.cls-tag.melee{background:#f0c27a}.cls-tag.range{background:#9edbba}.cls-tag.support{background:#f1e39d}.cls-tag.debuffer{background:#c9a6ef}
.chip{display:inline-flex;align-items:center;gap:1px;height:18px;padding:0 4px 0 2px;border-radius:9px;border:1.5px solid var(--ink);
 background:var(--c,#ccc);color:#1d130e;font-size:10px;font-weight:900;line-height:1}
.chip .ic{width:13px;height:13px;stroke-width:2.3}
.chip b{font-weight:900;min-width:6px}
.chip.debuff{box-shadow:inset 0 -2px 0 #0000002e}
.chip.more{background:#3a2b1f;color:var(--text);padding:0 5px}
.st-poison{--c:#8be06a}.st-burn{--c:#ffa94a}.st-bleed{--c:#ff7a7a}.st-shield{--c:#9fd0ff}.st-fortify{--c:#d8c08a}.st-empower{--c:#ffd24a}
.st-weaken{--c:#c3a0ff}.st-strain{--c:#e7a6ff}.st-haste{--c:#7ef0c4}.st-slow{--c:#8fa8ff}.st-regen{--c:#a6ffb3}.st-reflect{--c:#eef3ff}.st-guard{--c:#b6d2f6}
.chip.debuff:not(.more){background:repeating-linear-gradient(135deg,var(--c) 0 5px,color-mix(in srgb,var(--c) 78%,#000) 5px 7px)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:60;
 background:var(--parch);color:#2b1d16;border:3px solid var(--ink);border-radius:12px;padding:9px 16px;font-weight:800;box-shadow:var(--shadow);transition:.25s;max-width:min(92vw,520px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Menu screens ---------- */
.screen.setup,.screen.guide{max-width:1240px;margin:auto;padding:max(14px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 28px max(20px,env(safe-area-inset-left))}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:14px}
.muster{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.m-side{background:linear-gradient(160deg,#47362a,var(--wood) 40%,#30241a);border:3px solid var(--ink);border-radius:16px;padding:8px 10px 6px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--team) 50%,transparent),var(--shadow)}
.m-side header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.team-name{font-family:var(--f-display);font-size:24px;line-height:1;color:var(--team-l)}
.cpu-toggle{min-height:32px;padding:3px 10px;font-size:12px;display:inline-flex;gap:5px;align-items:center;border-radius:99px}
.cpu-toggle .ic{width:15px;height:15px}
.cpu-toggle.on{background:linear-gradient(180deg,#9ad7ff,#4c8fd6);color:#10233d}
.m-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.m-slot-btn>*{max-width:100%}
.m-slot{position:relative;container-type:inline-size}
/* Narrow slots keep the class readable as an icon rather than a clipped word. */
@container (max-width:100px){.m-slot .cls-tag .ct-label{display:none}.m-slot .cls-tag{padding:2px 5px}.m-slot .cls-tag .ic{width:13px;height:13px}.m-name{font-size:11px}}
.m-slot-btn{width:100%;height:100%;min-height:92px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px;
 background:#00000030;border:2px dashed #ffffff30;box-shadow:none;color:var(--muted)}
.m-slot.filled .m-slot-btn{border-style:solid;border-color:var(--ink);background:linear-gradient(180deg,#5a4433,#3a2b1f)}
.m-slot.on .m-slot-btn{border:2px solid var(--gold);box-shadow:0 0 0 3px #e9c25a55,0 0 18px #e9c25a55;color:var(--text)}
.m-no{position:absolute;left:6px;top:4px;font-family:var(--f-display);font-size:15px;color:var(--dim)}
.m-name{font-weight:900;font-size:12px;color:var(--text);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-empty{font-size:10px;line-height:1.25;text-align:center;font-weight:800;padding:0 4px}
.m-clear{position:absolute;right:-4px;top:-4px;min-height:24px;width:24px;padding:0;display:grid;place-items:center;border-radius:50%}
.m-clear .ic{width:13px;height:13px;stroke-width:2.6}
.m-axis{display:flex;justify-content:space-between;font-size:9px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:4px;padding:0 4px}
.m-vs{align-self:center;font-family:var(--f-display);font-size:30px;color:var(--gold);text-shadow:0 3px 0 var(--ink)}
.m-help{margin:10px 2px 8px;color:var(--muted);font-size:12.5px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(158px,calc((100% - 24px) / 4)),1fr));gap:8px}
.hero-card{position:relative}
.hero-pick{width:100%;height:100%;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto auto;align-content:start;gap:5px 8px;text-align:left;padding:8px 10px 9px;border-radius:14px;color:#2b1d16;
 background:radial-gradient(120% 90% at 50% 40%,var(--parch) 55%,var(--parch2));box-shadow:inset 0 -3px 0 #c8b088,0 3px 0 var(--ink)}
.hero-pick .face{width:44px;height:44px}
.hc-text{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.hc-name{font-family:var(--f-display);font-size:17px;line-height:1.05;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-stats{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11.5px;font-weight:900;color:#6b5638;white-space:nowrap}
.hc-slots{grid-column:1/-1;padding-right:30px;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#8a7350}
.hc-info{position:absolute;right:6px;bottom:6px;min-height:30px;width:30px;padding:0;display:grid;place-items:center;border-radius:50%;background:#fff3;border-color:#2b1d1655;box-shadow:none;color:#6b5638}
.hc-info .ic{width:17px;height:17px}
.hero-card.in-party .hero-pick{box-shadow:inset 0 0 0 3px var(--team),inset 0 -3px 0 #c8b088,0 3px 0 var(--ink)}
.hero-card.in-party .hc-slots{color:var(--team)}
.hero-card.blocked .hero-pick{filter:saturate(.35) brightness(.78)}
.setup-foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:12px;flex-wrap:wrap}
.setup-foot .start{min-width:190px;font-size:16px}
@media (max-width:520px){.setup-foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}.setup-foot .start{grid-column:1/-1;order:1}.setup-foot .quiet{padding:8px 6px}}
.guide-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{border:3px solid var(--ink);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.card.wide{grid-column:1/-1}
.card h2{margin-bottom:8px}.card p{margin:6px 0;font-size:13px}
.card table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
.card th,.card td{text-align:left;padding:5px 6px;border-bottom:1.5px solid #c8b088;vertical-align:top}
.card td .ic{display:inline-block;vertical-align:-4px;width:16px;height:16px}
.card td .chip{vertical-align:-4px}
.table-wrap{overflow-x:auto}

/* ---------- Battle layout: full-viewport, landscape first ---------- */
html,body{overscroll-behavior:none}
.screen.battle{position:relative;height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hud-top{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:6px 10px 4px;
 background:linear-gradient(180deg,#2a1f16,#1d1610);border-bottom:3px solid var(--ink);position:relative;z-index:20}
.mp{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:6px;align-items:center}
.mp.t1{justify-items:end}
.mp-label{font-family:var(--f-display);font-size:17px;line-height:1;color:var(--team-l)}
.mp-num{font-weight:900;font-size:15px;line-height:1}.mp-num small{font-size:9px;color:var(--dim);margin-left:2px}
.mp.t1 .mp-label{order:2}.mp.t1 .mp-num{order:1}
.orbs{grid-column:1/3;display:flex;gap:3px;margin-top:4px}
.mp.t1 .orbs{flex-direction:row}
.orb{width:11px;height:11px;transform:rotate(45deg);border:2px solid var(--ink);background:#14100c;border-radius:2px}
.orb.on{background:radial-gradient(circle at 35% 30%,#fff,var(--team-l) 45%,var(--team));box-shadow:0 0 6px var(--team)}
.orb.spend{animation:spend .8s infinite alternate}
@keyframes spend{to{background:#ffd24a;box-shadow:0 0 8px #ffd24a}}
.cycle-badge{width:58px;height:58px;border-radius:50%;display:grid;place-content:center;text-align:center;line-height:1;color:#2b1d16;
 background:radial-gradient(circle at 40% 30%,#ffe9a0,var(--gold) 55%,var(--gold2));border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.cycle-badge span{font-size:7.5px;font-weight:900;letter-spacing:.14em}.cycle-badge strong{font-family:var(--f-display);font-size:24px}.cycle-badge small{font-size:7.5px;font-weight:900}
/* Timeline: the next activations, a gold NOW card first. */
.timeline-wrap{min-width:0;display:flex;flex-direction:column;gap:3px}
.timeline{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);list-style:none;margin:0;padding:0 2px;display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;height:52px}
.tl-item{position:relative;flex-shrink:0;cursor:pointer}
.tl-item .face{width:38px;height:38px;border-width:2.5px;box-shadow:0 0 0 3px var(--team) inset}
.tl-item.now .face{width:50px;height:50px;border-color:#2b1d16;box-shadow:0 0 0 3px var(--team) inset,0 0 0 3px var(--gold),0 0 16px #ffd24a}
.tl-now,.tl-n{position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);font-size:8.5px;font-weight:900;line-height:1;padding:2px 4px;border-radius:5px;border:1.5px solid var(--ink);background:var(--team);color:#fff}
.tl-now{background:var(--gold);color:#2b1d16;letter-spacing:.08em}
.tl-n{bottom:-3px;min-width:14px;text-align:center}
.tl-spd{position:absolute;right:-4px;top:-3px;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center}
.tl-spd .ic{width:11px;height:11px;stroke-width:3}
.tl-spd.up{background:#7ef0c4}.tl-spd.down{background:#8fa8ff}
.tl-cycle{flex-shrink:0;align-self:stretch;display:flex;align-items:center;padding:0 1px}
.tl-cycle span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;font-weight:900;letter-spacing:.12em;color:#2b1d16;background:var(--gold);border:1.5px solid var(--ink);border-radius:5px;padding:4px 1px}
.tl-shift{position:absolute;left:50%;top:-8px;transform:translateX(-50%);font-size:10px;font-weight:900;white-space:nowrap;padding:0 4px;border-radius:5px;border:1.5px solid var(--ink);animation:shift 2.4s forwards}
.flash-adv .tl-shift{background:#7ef0c4;color:#10331f}.flash-del .tl-shift{background:#c3a0ff;color:#24123d}
.flash-adv .face{animation:glowAdv 1.4s 2}.flash-del .face{animation:glowDel 1.4s 2}
@keyframes glowAdv{50%{box-shadow:0 0 0 3px var(--team) inset,0 0 0 3px #7ef0c4,0 0 14px #7ef0c4}}
@keyframes glowDel{50%{box-shadow:0 0 0 3px var(--team) inset,0 0 0 3px #c3a0ff,0 0 14px #c3a0ff}}
@keyframes shift{0%,70%{opacity:1}100%{opacity:0}}
/* Gauge track: every living hero's gauge position; Dawn rides above the rail, Dusk below. */
.track{position:relative;height:26px;margin:0 12px 0 10px}
.track-rail{position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;border:1.5px solid var(--ink);background:linear-gradient(90deg,#3a2b1f,#6b5a3a 70%,#e9c25a)}
.track-rail::after{content:"";position:absolute;right:-6px;top:-6px;width:12px;height:12px;transform:rotate(45deg);background:var(--gold);border:2px solid var(--ink)}
.tk{position:absolute;top:calc(var(--lane)*12px - 0px);transform:translateX(-50%);z-index:1}
.tk .face{width:16px;height:16px;border-width:1.5px;box-shadow:0 0 0 1.5px var(--team) inset}
.tk.now{z-index:2}.tk.now .face{box-shadow:0 0 0 1.5px var(--team) inset,0 0 0 2px var(--gold)}

.lines{position:absolute;inset:0;display:grid;grid-template-columns:1fr clamp(26px,4vw,56px) 1fr;padding:0 max(8px,1vw)}
.line{display:grid;grid-template-columns:repeat(4,1fr);min-width:0}
.rift{align-self:center;justify-self:center;color:#ffd24a;filter:drop-shadow(0 2px 0 var(--ink)) drop-shadow(0 0 10px #ffd24a);margin-top:8%}
.rift .ic{width:clamp(22px,3.4vw,40px);height:clamp(22px,3.4vw,40px);stroke-width:2.4;fill:#fff3b0;stroke:#2b1d16}
.slot{position:relative;min-width:0;container-type:size;--fh:58%;--fb:22%;--fpx:min(var(--fhq,58cqh),160cqw)}
.fighter{position:absolute;left:50%;translate:-50% 0;bottom:var(--fb);height:var(--fpx);aspect-ratio:144/184;z-index:3;transition:filter .2s,opacity .2s}
.fighter .sprite{width:100%;height:100%}
.plinth{position:absolute;left:50%;translate:-50% 0;bottom:calc(var(--fb) - 6%);width:min(84%,calc(var(--fpx) * .62));aspect-ratio:3.2/1;border-radius:50%;
 background:radial-gradient(closest-side,#00000055,#0000 75%),radial-gradient(70% 60% at 50% 45%,#b8a888,#8a7a5c);border:2.5px solid var(--ink);box-shadow:inset 0 -4px 0 #00000033,0 0 0 2px color-mix(in srgb,var(--team) 70%,transparent);z-index:1}
.slot-no{position:absolute;left:50%;top:100%;transform:translate(-50%,2px);font-family:var(--f-display);font-size:13px;line-height:1;color:#fff8e6;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.unit-hud{position:absolute;left:4%;right:4%;bottom:calc(var(--fb) + var(--fpx) * .9);display:flex;flex-direction:column;align-items:center;gap:1px;z-index:5;pointer-events:none}
.u-name{font-size:10.5px;font-weight:900;color:#fff8e6;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hpbar{position:relative;width:min(100%,104px);height:9px;border-radius:5px;background:#1e140c;border:2px solid var(--ink);overflow:hidden}
.hpbar .hp{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#9df07a,#45b043);border-radius:3px}
.t1 .hpbar .hp{background:linear-gradient(180deg,#ff9f7a,#d4493a)}
.hpbar .sh{position:absolute;right:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,#bfe3ff 0 3px,#7fb5e6 3px 6px)}
.hp-num{font-size:10px;font-weight:900;color:#fff8e6;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;line-height:1}
.hp-num small{font-size:8px}.hp-num em{font-style:normal;color:#bfe3ff;margin-left:2px}
.chips{position:absolute;left:0;right:0;top:calc(100% - var(--fb) + 6% + 17px);display:flex;flex-wrap:wrap;justify-content:center;gap:2px;z-index:6;pointer-events:none;padding:0 2px}
.slot-hit{position:absolute;inset:0;z-index:8;background:transparent;border:0;box-shadow:none;border-radius:14px;min-height:0;padding:0}
.slot-hit:hover:not(:disabled){filter:none;background:#ffffff10}
.slot-hit:active:not(:disabled){transform:none;box-shadow:none}
.slot-hit:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.slot.empty .plinth{opacity:.5;box-shadow:inset 0 -4px 0 #00000033}
.vacant{position:absolute;left:0;right:0;bottom:calc(var(--fb) + 8%);text-align:center;font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#2b1d1688}
.slot.dead .plinth{filter:grayscale(1) brightness(.7);box-shadow:inset 0 -4px 0 #00000033}
.grave{position:absolute;left:50%;translate:-50% 0;bottom:calc(var(--fb) - 2%);width:min(36%,52px);z-index:2}
.grave svg{width:100%;height:auto}
.fallen{font-size:10px;font-weight:900;color:#f3e6c8;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;opacity:.85;margin-top:12px;white-space:nowrap}
/* Turn and targeting states */
.slot.active .plinth{background:radial-gradient(70% 60% at 50% 45%,#ffe9a0,#e6a83a);box-shadow:inset 0 -4px 0 #00000033,0 0 0 3px var(--gold),0 0 22px #ffd24a}
.active-arrow{position:absolute;left:50%;bottom:calc(var(--fb) + var(--fpx) * .9 + 34px);width:16px;height:14px;translate:-50% 0;z-index:7;background:var(--gold);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 2px 0 var(--ink));animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.slot.dim .fighter{filter:saturate(.7) brightness(.86)}
.slot.target .plinth{box-shadow:inset 0 -4px 0 #00000033,0 0 0 3px #ff6b56,0 0 18px #ff6b56;animation:pulse 1.1s ease-in-out infinite}
.slot.target.ally .plinth{box-shadow:inset 0 -4px 0 #00000033,0 0 0 3px #7ef08a,0 0 18px #7ef08a}
.slot.target::after,.slot.affected::after{content:"";position:absolute;left:50%;bottom:calc(var(--fb) + var(--fpx) * .9 + 34px);width:18px;height:16px;translate:-50% 0;z-index:7;pointer-events:none;
 background:#ff6b56;clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 2px 0 var(--ink));animation:bob 1s ease-in-out infinite}
.slot.target.ally::after{background:#7ef08a}
.slot.chosen::after,.slot.affected::after{background:var(--gold);animation:none}
.slot.chosen .plinth,.slot.affected .plinth{box-shadow:inset 0 -4px 0 #00000033,0 0 0 4px var(--gold),0 0 24px #ffd24a;animation:none}
.slot.chosen .fighter,.slot.affected .fighter{filter:drop-shadow(0 0 6px #ffe9a0)}
@keyframes pulse{50%{filter:brightness(1.25)}}
@keyframes spin{to{transform:rotate(360deg)}}
.preview-tag{position:absolute;left:50%;bottom:calc(var(--fb) + var(--fpx) * .45);transform:translateX(-50%);z-index:9;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:3px;pointer-events:none;
 padding:3px 7px;border-radius:10px;border:2.5px solid var(--ink);background:#fff8e6;box-shadow:0 3px 0 var(--ink);max-width:150%;animation:pop .25s cubic-bezier(.2,.8,.3,1.4)}
@keyframes pop{from{transform:translateX(-50%) scale(.5);opacity:0}}

function actionBar(a,human,legal,primary,preview){
 const g=game;
 if(g.winner!==null)return `<footer class="actionbar"><div class="ab-prompt"><strong>${g.winner==='draw'?'Draw':TEAM[g.winner]+' wins'}</strong></div></footer>`;
 if(!a)return '<footer class="actionbar"></footer>';
 const h=byId[a.hero],s=h.skill,reason=g.skillReason(a),cost=g.skillCost(a),spd=g.spdOf(a);
 const who=`<button class="ab-hero t${a.team}" data-dossier-unit="${a.uid}" aria-label="${esc(g.name(a))} details">${face(a.hero,a.team,'big')}<span class="ab-id"><span class="ab-team">${TEAM[a.team]}${isCpu(a.team)?' · CPU':''}</span><span class="ab-name">${h.name}</span><span class="ab-meta">♥ ${a.hp}/${a.maxHp} · SPD ${spd}${spd!==a.spd?`<em class="${spd>a.spd?'up':'down'}">(${spd>a.spd?'+':''}${spd-a.spd})</em>`:''}</span></span><span class="ab-chips">${statusChips(a,4)}</span></button>`;
 if(!human)return `<footer class="actionbar cpu t${a.team}">${who}<div class="ab-prompt"><span class="thinking"><i></i><i></i><i></i></span><strong>${TEAM[a.team]} is deciding…</strong></div></footer>`;
 let prompt;
 if(primary){const pv=preview[primary.uid]||{};const names=Object.keys(preview).filter(k=>preview[k].dmg!==undefined||preview[k].heal||preview[k].statuses?.length).length;
  prompt=`<strong>${ui.mode==='basic'?'Attack':s.name} → ${esc(byId[primary.hero].name)}${names>1?` +${names-1}`:''}</strong><span>${ui.mode==='skill'?`${cost} MP · `:''}Tap again or confirm</span>`;}
 else prompt=ui.mode==='basic'?`<strong>Basic attack</strong><span>Free · tap a highlighted enemy (slots 1–${a.slot}${legal.some(t=>t.slot>a.slot)?' + exposed front':''})</span>`:`<strong>${s.name}</strong><span>${esc(targetHint(s))}</span>`;
 return `<footer class="actionbar t${a.team}">${who}
  <div class="ab-actions" role="group" aria-label="Actions">
   <button class="act ${ui.mode==='basic'?'on':''}" data-action="mode-basic" data-key="act-basic" aria-pressed="${ui.mode==='basic'}">${icon('swords')}<span>Attack</span><small>Free</small></button>
   <button class="act skill ${ui.mode==='skill'?'on':''}" data-action="mode-skill" data-key="act-skill" aria-pressed="${ui.mode==='skill'}" aria-disabled="${!!reason}" title="${esc(s.name+': '+s.text)}">${icon(SKILL_ICON[a.hero])}<span>${s.name}</span><small class="${reason?'no':''}">${esc(reason?shortReason(a,cost):`${cost} MP${s.cd?` · CD ${s.cd}`:''}`)}</small>${a.cd>0?`<b class="cd">${a.cd}</b>`:''}</button>
   <button class="act" data-action="wait" data-key="act-wait">${icon('wait')}<span>Wait</span><small>End turn</small></button>
  </div>
  <div class="ab-prompt" role="status">${prompt}</div>
  ${primary?`<div class="ab-confirm"><button class="cancel icon-btn" data-action="cancel" data-key="cancel" aria-label="Cancel">${icon('close')}</button><button class="primary confirm" data-action="confirm" data-key="confirm">${icon('check')}<span>Confirm</span></button></div>`:''}
 </footer>`;
}
/* Button-sized version of skillReason(); the full sentence still shows in the toast. */
const shortReason=(a,cost)=>a.cd>0?`Ready in ${a.cd}`:!game.mp.canAfford(a.team,cost)?`Need ${cost} MP`:'No target';
const targetHint=s=>({basic:'Uses basic reach · tap a highlighted enemy',any:'Ignores formation · tap any enemy',all:'Hits every enemy · confirm to cast',front:'Front enemy only',rear:'Rearmost enemy only',ally:'Tap an ally (or this hero)',allyOther:'Tap another ally',self:'Targets self'}[s.target]||'Choose a target');
function victory(){const w=game.winner;return `<div class="victory t${w}" role="dialog" aria-label="Battle over"><div class="v-card"><div class="eyebrow">Battle over · cycle ${game.cycles.cycle} · ${game.turn} turns</div><h2>${w==='draw'?'Both lines fall':TEAM[w]+' holds the rift'}</h2><div class="v-row">${game.side(w==='draw'?0:w).map(u=>face(u.hero,u.team,u.hp>0?'':'gone')).join('')}</div><div class="v-buttons"><button class="primary" data-action="rematch">Rematch</button><button class="quiet" data-action="setup">Change squads</button></div></div></div>`;}

/* ---------- guide ---------- */
function guideView(){
 const st=Object.entries(Status.STATUS).map(([id,d])=>`<tr><td><span class="chip st-${id} ${d.kind}">${icon(id)}</span> ${d.name}</td><td>${d.kind==='buff'?'Buff':'Debuff'}</td><td>${esc(d.text({potency:'N'}))}</td><td>${Object.entries(d.defaults).map(([k,v])=>`${v} ${k}`).join(', ')}</td></tr>`).join('');
 return `<main class="screen guide"><header class="top">${brand()}${nav('guide')}</header><div class="guide-grid">
 <section class="card parchment"><h2>Formation</h2><p>Each party holds four fixed slots. <strong>Slot 1 is the front</strong>, closest to the enemy. Heroes never move; when one falls, the slot stays empty.</p>
  <table><thead><tr><th>Class</th><th>Slots</th></tr></thead><tbody>${Object.entries(Formation.CLASSES).map(([k,c])=>`<tr><td>${icon(CLASS_ICON[k])} ${c.name}</td><td>${c.slots.join(', ')}</td></tr>`).join('')}</tbody></table>
  <p>A basic attack from slot N reaches enemy slots 1…N. The <strong>frontmost living enemy is always reachable</strong>, so when the front collapses the next hero is exposed. Skills may ignore this (“any enemy”, “every enemy”), and splash follows exact slots, so an empty slot stops it.</p></section>
 <section class="card parchment"><h2>Speed &amp; the timeline</h2><p>Every hero fills an action gauge at its SPD. Whoever fills first acts; while you decide, time stands still. Faster heroes simply act more often — there are no thresholds or turn caps.</p>
  <p><strong>Haste/Slow</strong> change SPD from now on without erasing progress. <strong>Advance/Delay</strong> push the gauge itself. The top timeline predicts the next ${CONFIG.forecast} activations and re-sorts the moment anything changes; the track beneath it shows each gauge live.</p>
  <p>Exact ties go to the higher SPD, then alternate between teams, then the front slot.</p></section>
 <section class="card parchment"><h2>Cycles &amp; MP</h2><p>A <strong>cycle</strong> ends once every living hero has acted at least once since it began. Fast heroes may act several times inside one cycle; fallen heroes never hold it up. Cycles never reset gauges.</p>
  <p>Each party shares one MP pool: start ${CONFIG.mp.start}, max ${CONFIG.mp.max}, <strong>+${CONFIG.mp.regen} per completed cycle</strong>. Basic attacks are free; skills cost MP and have cooldowns counted in the caster’s own turns.</p>
  <p>At cycle end: Poison/Burn → Rift fatigue (cycle ${CONFIG.fatigue.from}+) → healing → passives → cycle durations tick → MP regenerates.</p></section>
 <section class="card parchment wide"><h2>Statuses</h2><p>Durations come in three kinds: <strong>t</strong> = the bearer’s own turns, <strong>c</strong> = battle cycles, <strong>×</strong> = uses. Re-applying refreshes rather than stacking. Direct damage resolves: Empower/Weaken → Guard → Fortify → Shield → HP → Reflect.</p>
  <div class="table-wrap"><table><thead><tr><th>Status</th><th>Type</th><th>Effect</th><th>Default</th></tr></thead><tbody>${st}</tbody></table></div></section>
 <section class="card parchment wide"><h2>Heroes</h2><div class="table-wrap"><table><thead><tr><th>Hero</th><th>Class</th><th>HP</th><th>ATK</th><th>SPD</th><th>Skill</th><th>Passive</th></tr></thead><tbody>${HEROES.map(h=>`<tr><td>${h.name}</td><td>${clsName(h.cls)}</td><td>${h.hp}</td><td>${h.atk}</td><td>${h.spd}</td><td><strong>${h.skill.name}</strong> (${h.skill.cost} MP, CD ${h.skill.cd}) ${esc(h.skill.text)}</td><td><strong>${esc(h.passive.name)}</strong> ${esc(h.passive.text)}</td></tr>`).join('')}</tbody></table></div><p class="small">All numbers are provisional prototype values.</p></section>
 </div></main>`;
}

/* ---------- dossier & modals ---------- */
let modalFocus=null;
function modal(html,cls=''){modalFocus=document.activeElement;$('#overlay').innerHTML=`<div class="modal-backdrop"><section class="modal ${cls}" role="dialog" aria-modal="true">${html}</section></div>`;RiftSprites.hydrate($('#overlay'));
 $('#overlay .modal-backdrop').onclick=e=>{if(e.target===e.currentTarget)closeModal();};for(const b of $$('#overlay [data-close]'))b.onclick=closeModal;
 for(const b of $$('#overlay [data-modal]'))b.onclick=()=>{const k=b.dataset.modal;closeModal();action(k);};$('#overlay button')?.focus();}
function closeModal(){$('#overlay').innerHTML='';modalFocus?.focus?.();}
function dossier(id,u=null){
 const h=byId[id],s=h.skill,team=u?u.team:ui.sel.team;
 const live=u?`<div class="d-live"><span>♥ ${u.hp}/${u.maxHp}</span><span>SPD ${game.spdOf(u)}</span><span>Gauge ${Math.round(u.gauge/Gauge.G*100)}%</span><span>Slot ${u.slot}</span>${u.cd?`<span>Skill CD ${u.cd}</span>`:''}</div>${u.statuses.length?`<ul class="d-status">${u.statuses.map(st=>{const d=Status.describe(st);return `<li><span class="chip st-${st.id} ${Status.STATUS[st.id].kind}">${icon(st.id)}</span><strong>${d.name}</strong> ${esc(d.text)} <em>${d.left}</em></li>`;}).join('')}</ul>`:''}`:'';
 modal(`<div class="modal-head"><span class="eyebrow">Hero dossier</span><button class="icon-btn" data-close aria-label="Close">${icon('close')}</button></div>
  <div class="d-top"><div class="d-art t${team}">${sprite(h.id,team,{uid:'dossier-'+h.id})}</div><div><h2>${h.name}</h2><div class="d-role"><span class="cls-tag ${h.cls}" title="${clsName(h.cls)}">${icon(CLASS_ICON[h.cls])}<span class="ct-label">${clsName(h.cls)}</span></span> ${esc(h.role)} · ${slotText(h.cls)}</div>
  <div class="d-stats"><div><strong>${h.hp}</strong><span>HP</span></div><div><strong>${h.atk}</strong><span>ATK</span></div><div><strong>${h.spd}</strong><span>SPD</span></div></div>${live}</div></div>
  <div class="d-skills"><div class="d-skill"><div class="d-skill-head">${icon(SKILL_ICON[h.id])}<strong>${s.name}</strong><span>${s.cost} MP · CD ${s.cd}</span></div><p>${esc(s.text)}</p></div>
  <div class="d-skill passive"><div class="d-skill-head">${icon('rift')}<strong>${esc(h.passive.name)}</strong><span>Passive</span></div><p>${esc(h.passive.text)}</p></div>
  <div class="d-skill basic"><div class="d-skill-head">${icon('swords')}<strong>Basic attack</strong><span>Free</span></div><p>${h.atk} damage to an enemy in slots 1…N (N = this hero’s slot), or the frontmost living enemy.</p></div></div>`,'dossier');
}
function menu(){
 modal(`<div class="modal-head"><h2>Paused</h2><button class="icon-btn" data-close aria-label="Close">${icon('close')}</button></div>
  <div class="menu-list"><button class="primary" data-close>Resume</button><button data-modal="log">Combat log</button><button data-modal="guide">Rules guide</button><button data-modal="rematch">Restart battle</button><button data-modal="setup">Change squads</button></div>
  <label class="menu-toggle"><span>Dawn</span><button class="cpu-toggle ${isCpu(0)?'on':''}" data-modal="cpu0">${isCpu(0)?'CPU':'Player'}</button><span>Dusk</span><button class="cpu-toggle ${isCpu(1)?'on':''}" data-modal="cpu1">${isCpu(1)?'CPU':'Player'}</button></label>`,'menu');
}
function logModal(){modal(`<div class="modal-head"><h2>Combat log</h2><button class="icon-btn" data-close aria-label="Close">${icon('close')}</button></div><div class="log">${[...game.log].reverse().map(l=>`<p>${esc(l)}</p>`).join('')}</div>`,'log-modal');}

/* ---------- input ---------- */
function bind(){
 for(const b of $$('[data-nav]'))b.onclick=()=>{ui.screen=b.dataset.nav;render();};
 for(const b of $$('[data-action]'))b.onclick=()=>action(b.dataset.action);
 for(const b of $$('[data-pick]'))b.onclick=()=>placeHero(b.dataset.pick);
 for(const b of $$('[data-dossier]'))b.onclick=()=>dossier(b.dataset.dossier);
 for(const b of $$('[data-dossier-unit]'))b.onclick=()=>{const u=game.unit(b.dataset.dossierUnit);dossier(u.hero,u);};
 for(const b of $$('[data-mslot]'))b.onclick=()=>{const[t,s]=b.dataset.mslot.split('-').map(Number);ui.sel={team:t,slot:s};render();};
 for(const b of $$('[data-mclear]'))b.onclick=()=>{const[t,s]=b.dataset.mclear.split('-').map(Number);prefs.parties[t][s-1]=null;ui.sel={team:t,slot:s};persist();render();};
 for(const b of $$('[data-cpu]'))b.onclick=()=>{const t=Number(b.dataset.cpu);prefs.cpu[t]=!prefs.cpu[t];persist();render();};
 for(const b of $$('[data-unit]'))b.onclick=()=>unitTap(b.dataset.unit);
 for(const b of $$('[data-tl]'))b.onclick=()=>{const u=game.unit(b.dataset.tl);dossier(u.hero,u);};
}
function unitTap(uid){
 const g=game,a=g.actor(),u=g.unit(uid);if(!u)return;
 if(ui.busy)return;
 const human=a&&!isCpu(a.team)&&g.winner===null;
 if(human&&g.canTarget(a,ui.mode,uid)){
  if(ui.target===uid||(ui.target&&g.affected(a,ui.mode,g.unit(ui.target)).targets.some(t=>t.uid===uid)&&byId[a.hero].skill.target==='all'&&ui.mode==='skill'))return confirm();
  ui.target=uid;render();return;
 }
 if(human&&ui.target){ui.target=null;render();return;}
 dossier(u.hero,u);
}
function confirm(){
 const a=game.actor();if(!a||!ui.target)return;
 const uid=ui.target;commit(()=>ui.mode==='basic'?game.basic(uid):game.skill(uid));
}
function action(name){
 const g=game;
 if(name==='start'){try{game=prepareBattle(new Battle(prefs.parties.map(p=>[...p])));}catch(e){return toast(e.message);}ui.screen='battle';ui.mode='basic';ui.target=null;ui.flash={};persist();render();return introFx();}
 if(name==='defaults'){prefs.parties=[['protector','blademaster','marksman','priest'],['dragoon','assassin','archmage','alchemist']];persist();render();return;}
 if(name==='mirror'){prefs.parties[1]=[...prefs.parties[0]];persist();render();return;}
 if(name==='resume'){ui.screen='battle';render();return;}
 if(name==='setup'){ui.screen='setup';render();return;}
 if(name==='guide'){ui.screen='guide';render();return;}
 if(name==='menu')return menu();
 if(name==='log')return logModal();
 if(name==='cpu0'||name==='cpu1'){const t=Number(name[3]);prefs.cpu[t]=!prefs.cpu[t];persist();render();return menu();}
 if(name==='rematch'){game=prepareBattle(new Battle(g.parties.map(p=>[...p])));ui.mode='basic';ui.target=null;ui.flash={};ui.screen='battle';persist();render();return introFx();}
 if(name==='portrait'){ui.portraitOk=true;document.body.classList.add('portrait-ok');return;}
 if(!g||ui.busy)return;
 const a=g.actor();if(!a||isCpu(a.team))return;
 if(name==='mode-basic'){ui.mode='basic';ui.target=null;render();return;}
 if(name==='mode-skill'){
  const reason=g.skillReason(a);if(reason)return toast(`${byId[a.hero].skill.name}: ${reason}.`);
  ui.mode='skill';ui.target=null;
  const s=byId[a.hero].skill,ts=g.targetsFor(a,'skill');if(s.target==='all'||s.target==='self'||ts.length===1)ui.target=ts[0].uid;
  render();return;
 }
 if(name==='wait'){ui.target=null;commit(()=>g.skip());return;}
 if(name==='cancel'){ui.target=null;render();return;}
 if(name==='confirm')return confirm();
}
/* Commit an engine action, replay it on the current board, then show the new state. */
async function commit(fn){
 if(ui.busy)return false;
 if(!fn()){toast('That action is not allowed.');return false;}
 const events=[...game.events];ui.busy=true;ui.target=null;persist();
 $('.battle')?.classList.add('busy');
 try{await RiftFX.play($('.battle'),events,game);}catch(e){console.error(e);}
 ui.busy=false;ui.mode='basic';ui.flash={};
 for(const e of events)if(e.t==='gauge')ui.flash[e.uid]=(ui.flash[e.uid]||0)+e.pct;
 render();
 return true;
}
function scheduleCpu(){
 clearTimeout(ui.cpuTimer);
 if(ui.screen!=='battle'||!game||game.winner!==null||ui.busy)return;
 const a=game.actor();if(!a||!isCpu(a.team))return;
 ui.cpuTimer=setTimeout(()=>{if(ui.busy||game.actor()!==a||$('#overlay').innerHTML)return scheduleCpu();const c=AI.choose(game);commit(()=>c.kind==='skip'?game.skip():game[c.kind](c.uid));},REDUCED?150:750);
}
function introFx(){const el=$('.battle');if(el&&!REDUCED)RiftFX.banner(el,'Battle begins');}
document.addEventListener('keydown',e=>{
 if($('#overlay .modal')){if(e.key==='Escape')closeModal();if(e.key==='Tab'){const f=$$('#overlay button'),first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}
 if(ui.screen!=='battle'||!game)return;
 if(e.key==='Escape'){if(ui.target)action('cancel');else action('menu');}
 else if(e.key==='1')action('mode-basic');else if(e.key==='2')action('mode-skill');else if(e.key==='3')action('wait');
 else if(e.key==='Enter'&&ui.target&&!e.target.closest('button')){e.preventDefault();confirm();}
});
render();
})();
</script></body></html>
